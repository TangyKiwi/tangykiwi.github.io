<script>
	var DARK_PARTICLE_COLOR = 'white';
	var LIGHT_PARTICLE_COLOR = '#2a2a2a';
	var particleInstance;

	function initParticles() {
		var isLight = document.documentElement.getAttribute("data-theme") === "light";
		particleInstance = new JParticles.particle('#particles', {
			color: isLight ? [LIGHT_PARTICLE_COLOR, '#f5ad42'] : [DARK_PARTICLE_COLOR, '#f5ad42'],
			proximity: 80,
			range: 120,
			parallax: true,
			maxSpeed: 0.55,
			minSpeed: 0.55
		});
	}
	function updateParticleColors(isLight) {
		if (!particleInstance || !particleInstance.dots) return;
		var from = isLight ? DARK_PARTICLE_COLOR : LIGHT_PARTICLE_COLOR;
		var to = isLight ? LIGHT_PARTICLE_COLOR : DARK_PARTICLE_COLOR;
		particleInstance.dots.forEach(function (dot) {
			if (dot.color === from) dot.color = to;
		});
	}
	function applyThemeIcon() {
		var isLight = document.documentElement.getAttribute("data-theme") === "light";
		document.getElementById("theme-icon").className = isLight ? "fa-solid fa-moon" : "fa-solid fa-sun";
	}
	function toggleTheme() {
		var root = document.documentElement;
		var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
		if (next === "light") root.setAttribute("data-theme", "light");
		else root.removeAttribute("data-theme");
		localStorage.setItem("theme", next);
		applyThemeIcon();
		updateParticleColors(next === "light");
	}
	applyThemeIcon();
	initParticles();
</script>
</body>
